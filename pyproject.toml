[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocotype-flutter-runtime"
dynamic = ["version"]
description = "Python runtime for the VoCoType Flutter Linux frontend"
readme = { file = "readme.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "VoCoType" }
]
dependencies = [
  "sounddevice==0.5.2",
  "librosa==0.11.0",
  "soundfile==0.13.1",
  "funasr_onnx==0.4.1",
  "jieba==0.42.1",
  "modelscope==1.30.0",
]

[project.optional-dependencies]
rime = [
  "pyrime>=0.2.1",
]
full = [
  "pyrime>=0.2.1",
]

[project.urls]
Homepage = "https://github.com/vocotype"

[project.scripts]
vocotype-download-models = "app.download_models:main"

[tool.setuptools]
py-modules = ["vocotype_version"]

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.setuptools.dynamic]
version = { attr = "vocotype_version.__version__" }
